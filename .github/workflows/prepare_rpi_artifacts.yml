name: Prepare RPI Artifacts

on:
  workflow_call:
    inputs:
      artifacts:
        required: true
        type: string
      BUILD_SOURCEBRANCH:
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  upload-artifacts-to-cloudsmith:
    runs-on: [self-hosted, repo-only]
    permissions:
      id-token: write
      contents: write
      actions: read

    steps:
    - name: Prepare path
      run: |
        rm -rf dist ; mkdir dist

    - name: Download artifacts
      run: |
        gh-get-workflow-artifacts()
        {
          artifacts=$(curl -sfL \
               -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $1 " \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               https://api.github.com/repos/$2/actions/runs/$3/artifacts)
          echo "$artifacts"
        }

        gh-download-artifact () {
          curl -sfL \
            -H "Authorization: Bearer $1" \
            -H "Accept: application/vnd.github+json" \
            -o "$2" \
            "$3"
        }

        artifacts=$(
          gh-get-workflow-artifacts ${{ secrets.GITHUB_TOKEN }} \
                                    ${{ github.repository }} \
                                    ${{ github.run_id }}
        )

        total_count=$(echo $artifacts | jq '.total_count' -r)

        if [[ "$total_count" == "null" ]] || [[ "$total_count" == "0" ]]; then
          exit
        fi

        artifacts_files=$(echo $artifacts | jq '[.artifacts[] | [.name, .archive_download_url]]' -r)
        patterns="${{ inputs.artifacts }}"
        echo $artifacts_files |  jq -r '.[] | @tsv' | while IFS=$'\t' read -r name url; do
          matched=0
          for p in $patterns; do
            if [[ $name == $p ]]; then
              matched=1
              break
            fi
          done

          if [[ "$matched" == "1" ]]; then
            echo "$name"
            gh-download-artifact ${{ secrets.GITHUB_TOKEN }} \
                                 "dist/$name" \
                                 "$url"
          else
            echo "$name no match, skipped"
          fi
        done

    - name: Prepare artifacts
      run: |
        for f in dist/*.zip; do
          unzip -o "$f" -d dist/
        done
        cd dist && ../ci/prepare_rpi_artifacts.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdg-rpi-artifacts
        path: ${{ github.workspace }}/dist/rpi_*.tar.gz
        if-no-files-found: ignore
